# ---------------------------------------------------------------
# Copy this file to k8s/secret.yaml, fill in real base64 values.
# NEVER commit secret.yaml — add it to .gitignore.
#
# Encode:  echo -n 'your-key-here' | base64
# ---------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: bidding-ai-secrets
  namespace: bidding-ai
type: Opaque
data:
  OPENAI_API_KEY: ""       # base64 of sk-...
  ANTHROPIC_API_KEY: ""    # base64 of sk-ant-...
  NVIDIA_API_KEY: ""       # base64 of nvapi-...
